[package]
name = "driver-vivevr"
version = "0.1.0"
edition = "2021"

[dependencies]
libc = "0.2"
libloading = "0.8.1"
once_cell = "1.18.0"
thiserror = "1.0.50"
tracing = "0.1.40"
tracing-subscriber = "0.3.17"

cppvtbl = "0.2.1"
real_c_string = "1.0.1"

valve-pm = { path = "../../crates/valve-pm" }
vive-hid = { path = "../../crates/vive-hid" }
lens-distortion = { path = "../../crates/lens-distortion" }
openvr = { path = "../../crates/openvr" }
tokio = { version = "1.34.0", features = ["rt", "rt-multi-thread"] }

[lib]
name = "driver_vivevr"
crate-type = ["cdylib"]
